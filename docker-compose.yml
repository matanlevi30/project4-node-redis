services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itemsdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d itemsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: itemsdb
      REDIS_HOST: cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # אין ports - ה-API לא נגיש ישירות, רק דרך Nginx (web)
    # healthcheck מבוסס node (בלי תלות ב-curl/wget שלא בהכרח מותקנים ב-image)
    # נדרש כדי שה-CI יוכל לחכות שגם ה-service הזה יגיע ל"healthy" ולא רק db/cache
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/usr/share/nginx/html/static:ro
    depends_on:
      - api
    # healthcheck מבוסס nginx -t - לא תלוי ב-wget/curl שלא בהכרח מותקנים
    # נדרש כדי שה-CI יוכל לחכות שכל 4 השירותים healthy, לא רק db/cache
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
